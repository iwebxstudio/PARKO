# ==============================================================================
# PARKO — ຟາຍກຳນົດຄ່າ Compose ເພີ່ມເຕີມສຳລັບສະພາບແວດລ້ອມການພັດທະນາ (Development Override)
# ວິທີການໃຊ້ງານ: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ເປີດໃຊ້ງານລະບົບ Vite Hot-Module-Reloading (HMR) ແບບສົດໆ ພ້ອມທັງ Mount ໂຟນເດີໂຄ້ດຈາກເຄື່ອງ Host ເຂົ້າ Container
# ==============================================================================

services:
  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - PORT=80
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=800
      - WATCHPACK_POLLING=true

  backend:
    environment:
      - NODE_ENV=development
