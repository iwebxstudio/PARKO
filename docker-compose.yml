# ==============================================================================
# PARKO — Parking Management System
# Production Docker Compose Configuration (Enterprise Standard)
# Zero-Config, Self-Healing, High-Performance Native Speed
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:

  # ──────────────────────────────────────────────────────────
  # 1. PostgreSQL 16 (High-Performance Tuned Database)
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parko_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-parko_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "synchronous_commit=off"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-39744}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-parko} -d $${POSTGRES_DB:-parko_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 128M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────────────────────
  # 2. Redis 7 (In-Memory Cache & Session Store)
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: parko-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-39745}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────────────────────
  # 3. NestJS Backend (Core Business API & WebSockets)
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: parko-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parko_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-parko_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-parko}:${POSTGRES_PASSWORD:-parko_secret_2024}@postgres:5432/${POSTGRES_DB:-parko_db}?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-parko-enterprise-secure-jwt-secret-key-32chars-min!}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: 5242880
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-39743}:3000"
    volumes:
      - upload_data:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 128M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────────────────────
  # 4. React Frontend (High-Performance Nginx Static Server)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: parko-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          memory: 32M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────────────────────
  # 5. Local Thermal Print Agent
  # ──────────────────────────────────────────────────────────
  print-agent:
    build:
      context: ./services/print-agent
      dockerfile: Dockerfile
    container_name: parko-print-agent
    restart: unless-stopped
    environment:
      PORT: 39746
      BACKEND_URL: http://backend:3000
      PRINT_QUEUE_INTERVAL: 5
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:39746/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────────────────────
  # 6. Nginx Gateway & SSL Reverse Proxy (Single Entrypoint)
  # ──────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: parko-nginx
    restart: unless-stopped
    ports:
      - "${PARKO_PORT:-39741}:80"
      - "${PARKO_SSL_PORT:-39742}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────────────────────
  # 7. Database Automated Backup Service
  # ──────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: parko-backup
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parko}
      POSTGRES_DB: ${POSTGRES_DB:-parko_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:-parko_secret_2024}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./infra/database/backup:/backup
    entrypoint: |
      sh -c '
      mkdir -p /backup
      echo "PARKO Automated Backup service initialized" > /backup/backup.log
      # Wait 60s initially for database migration to settle
      sleep 60
      while true; do
        timestamp=$$(date +%Y%m%d_%H%M%S)
        echo "[$$] Starting database backup at $$timestamp"
        
        pg_dump -h postgres -U $${POSTGRES_USER:-parko} -d $${POSTGRES_DB:-parko_db} \
          -f /backup/backup_$${timestamp}.sql 2>> /backup/backup.log
        
        find /backup -name "backup_*.sql" -mtime +$${BACKUP_RETENTION_DAYS} -delete
        echo "[$$] Backup completed: $$timestamp" >> /backup/backup.log
        
        # Backup interval: 12 hours (43200 seconds)
        sleep 43200
      done
      '
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/backup/backup.log"]
      interval: 1m
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: parko_postgres_data
  redis_data:
    name: parko_redis_data
  upload_data:
    name: parko_upload_data
  backend_logs:
    name: parko_backend_logs
  nginx_certs:
    name: parko_nginx_certs
  nginx_logs:
    name: parko_nginx_logs

networks:
  default:
    name: parko_network
    driver: bridge
