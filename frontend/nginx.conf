server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ເປີດໃຊ້ງານການບີບອັດຂໍ້ມູນດ້ວຍ Gzip (Gzip Compression) ເພື່ອເພີ່ມຄວາມໄວໃນການໂຫຼດເວັບໄຊ
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ການເກັບແຄຊໄຟລ໌ຄົງທີ່ (Static Assets Caching) ເຊັ່ນ: CSS, JS, ຮູບພາບ ເປັນເວລາ 1 ປີ ໂດຍບໍ່ມີການປ່ຽນແປງ
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ການກຳນົດເສັ້ນທາງຂອງແອັບ Single Page Application (SPA Routing) ໂດຍບໍ່ເກັບແຄຊ index.html ເພື່ອໃຫ້ຜູ້ໃຊ້ໄດ້ຮັບເວີຊັນລ່າສຸດສະເໝີ
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ລະບົບແປງຊື່ໂດເມນພາຍໃນຂອງ Docker (Docker Internal DNS Resolver 127.0.0.11)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ການສົ່ງຕໍ່ຄຳຂໍ API ໄປຍັງລະບົບຫຼັງບ້ານ (API Proxy Fallback ໄປຫາ backend:3000)
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ການສົ່ງຕໍ່ການເຊື່ອມຕໍ່ແບບເວລາຈິງ WebSocket (WebSocket Proxy Fallback ໄປຫາ backend:3000)
    location /socket.io/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
