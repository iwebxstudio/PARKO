version: '3.9'

# ──────────────────────────────────────
# Environment Validation Template
# ──────────────────────────────────────
x-env-validation: &env-validation
  env_file:
    - .env.production
  environment:
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - DATABASE_URL
    - JWT_SECRET
    - VITE_API_URL
    - VITE_WS_URL

# ──────────────────────────────────────
# Logging Template
# ──────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

# ──────────────────────────────────────
# Resource Template
# ──────────────────────────────────────
x-resources: &default-resources
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.25'
        memory: 256M

services:

  # ──────────────────────────────────────
  # PostgreSQL (PRODUCTION DB)
  # ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parko-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    logging: *default-logging
    networks:
      - parko-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ──────────────────────────────────────
  # Redis (Cache / Queue)
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: parko-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          memory: 128M
    logging: *default-logging
    networks:
      - parko-network

  # ──────────────────────────────────────
  # NestJS Backend (API Core)
  # ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: parko-backend
    restart: always
    <<: *env-validation
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - upload_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging
    networks:
      - parko-network
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────
  # React Frontend (Nginx Build)
  # ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: parko-frontend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    logging: *default-logging
    networks:
      - parko-network

  # ──────────────────────────────────────
  # Print Agent (Hardware Access)
  # ──────────────────────────────────────
  print-agent:
    build:
      context: ./print-agent
    container_name: parko-print-agent
    restart: always
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    environment:
      - BACKEND_URL=http://backend:3000
      - PRINT_QUEUE_INTERVAL=5
    healthcheck:
      test: ["CMD", "pgrep", "-f", "print-agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    logging: *default-logging
    networks:
      - parko-network
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────
  # Nginx (Production Gateway)
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: parko-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    networks:
      - parko-network

  # ──────────────────────────────────────
  # Database Backup Service (10/10 Feature)
  # ──────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: parko-backup
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - ./backup:/backup
      - ./backup-scripts:/scripts:ro
    entrypoint: |
      sh -c '
      while true; do
        timestamp=$(date +%Y%m%d_%H%M%S)
        echo "[$$] Starting backup at $$timestamp"
        
        # Full database backup
        pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} \
          -F c -b -v -f /backup/backup_$${timestamp}.dump
        
        # Compress and encrypt (optional)
        gzip /backup/backup_$${timestamp}.dump
        
        # Clean old backups
        find /backup -name "backup_*.dump.gz" -mtime +$${BACKUP_RETENTION_DAYS} -delete
        
        # Create backup log
        echo "Backup completed: $$timestamp" >> /backup/backup.log
        
        # Backup every 6 hours (21600 seconds)
        sleep 21600
      done
      '
    healthcheck:
      test: ["CMD", "test", "-f", "/backup/backup.log"]
      interval: 1h
      timeout: 10s
      retries: 3
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    networks:
      - parko-network

  # ──────────────────────────────────────
  # Watchtower (Automated Updates)
  # ──────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: parko-watchtower
    restart: always
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: --label-enable --cleanup --interval 86400
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    networks:
      - parko-network

  # ──────────────────────────────────────
  # Prometheus Metrics (Optional Monitoring)
  # ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: parko-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    networks:
      - parko-network

  # ──────────────────────────────────────
  # Grafana Dashboard
  # ──────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: parko-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    networks:
      - parko-network

volumes:
  postgres_data:
    name: parko_postgres_data
  redis_data:
    name: parko_redis_data
  upload_data:
    name: parko_upload_data
  prometheus_data:
    name: parko_prometheus_data
  grafana_data:
    name: parko_grafana_data

networks:
  parko-network:
    name: parko_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
