worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    client_max_body_size 25M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:3000;
        keepalive 32;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # ລະບົບ Web Server ສຳລັບໂປຣໂຕຄໍ HTTP (ພອດ 80)
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ສົ່ງຕໍ່ຄຳຮ້ອງຂໍ REST API ໄປຫາລະບົບ Backend ພ້ອມຄວບຄຸມອັດຕາການຮຽກໃຊ້ງານ (Rate Limit)
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;
            proxy_read_timeout 300s;
        }

        # ສົ່ງຕໍ່ການເຊື່ອມຕໍ່ແບບສອງທິດທາງ WebSocket / Socket.io ໄປຫາ Backend Gateway
        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ໃຫ້ບໍລິການໄຟລ໌ ແລະ ຮູບພາບຍານພາຫະນະທີ່ຖືກອັບໂຫຼດ ພ້ອມລະບົບແຄຊ 30 ວັນ
        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ຈຸດກວດສອບສະຖານະການເຮັດວຽກຂອງລະບົບ (Health Check Endpoint)
        location /health {
            proxy_pass http://backend_upstream/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ສົ່ງຕໍ່ຄຳຮ້ອງຂໍການພິມໃບບິນໄປຫາບໍລິການ Local Thermal Print Agent
        location /print {
            proxy_pass http://print-agent:39746;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ສົ່ງຕໍ່ຄຳຮ້ອງຂໍໜ້າເວັບທັງໝົດໄປຫາ React Frontend Single Page Application
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffers 16 64k;
            proxy_buffer_size 128k;
            proxy_busy_buffers_size 256k;
            proxy_read_timeout 300s;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # ລະບົບ Web Server ສຳລັບໂປຣໂຕຄໍ HTTPS ທີ່ເຂົ້າລະຫັດປອດໄພ SSL/TLS (ພອດ 443)
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ສົ່ງຕໍ່ຄຳຮ້ອງຂໍ REST API ໄປຫາລະບົບ Backend ພ້ອມຄວບຄຸມອັດຕາການຮຽກໃຊ້ງານ (Rate Limit)
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;
            proxy_read_timeout 300s;
        }

        # ສົ່ງຕໍ່ການເຊື່ອມຕໍ່ແບບສອງທິດທາງ WebSocket / Socket.io ໄປຫາ Backend Gateway
        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ໃຫ້ບໍລິການໄຟລ໌ ແລະ ຮູບພາບຍານພາຫະນະທີ່ຖືກອັບໂຫຼດ ພ້ອມລະບົບແຄຊ 30 ວັນ
        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ຈຸດກວດສອບສະຖານະການເຮັດວຽກຂອງລະບົບ (Health Check Endpoint)
        location /health {
            proxy_pass http://backend_upstream/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ສົ່ງຕໍ່ຄຳຮ້ອງຂໍການພິມໃບບິນໄປຫາບໍລິການ Local Thermal Print Agent
        location /print {
            proxy_pass http://print-agent:39746;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ສົ່ງຕໍ່ຄຳຮ້ອງຂໍໜ້າເວັບທັງໝົດໄປຫາ React Frontend Single Page Application
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffers 16 64k;
            proxy_buffer_size 128k;
            proxy_busy_buffers_size 256k;
            proxy_read_timeout 300s;
        }
    }
}
